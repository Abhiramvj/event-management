<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Mango Events & Media</title>
  <link rel="icon" href="/images/logo-fav.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="/src/style.css" rel="stylesheet">
  <style>
    .font-serif { font-family: 'Playfair Display', serif; }
    .font-sans { font-family: 'Poppins', sans-serif; }
    .header-transparent { background-color: transparent; transition: background-color 0.3s ease; }
    .header-scrolled { background-color: #210640; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); }
  </style>
</head>
<body class="font-sans bg-gray-50">

  <!-- Header -->
  <div id="header-placeholder"></div>

  <main>
    <!-- Hero Section -->
    <div class="relative h-72 md:h-96 bg-cover bg-center" style="background-image: url('images/aboutus.png');">
      <div class="absolute inset-0 bg-black opacity-50"></div>
      <div class="container mx-auto px-6 h-full flex flex-col items-center justify-center text-white relative z-10">
        <h1 class="font-serif text-4xl md:text-6xl font-bold">Gallery</h1>
      </div>
    </div>

    <!-- Gallery Section -->
    <section class="py-20 md:py-28 bg-white">
      <div class="container mx-auto px-6">
        <div class="text-center mb-16">
          <h2 class="font-serif text-4xl md:text-5xl text-gray-800">See Our Events in Action</h2>
          <p class="mt-4 text-lg text-gray-600">A showcase of the energy, passion, and unforgettable moments we create.</p>
        </div>
        
        <!-- Uniform Video Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
          <!-- Video 1 Card -->
          <div class="flex flex-col items-center">
            <div class="overflow-hidden rounded-2xl shadow-lg w-full h-80 bg-black">
              <video class="w-full h-full object-contain rounded-2xl" loop controls muted playsinline>
                <source src="videos/video1.mp4" type="video/mp4">
                Your browser does not support the video tag.
              </video>
            </div>
            <h3 class="font-serif text-lg mt-4 text-white text-center bg-gradient-to-r from-purple-600 via-pink-500 to-yellow-400 px-4 py-2 rounded-full shadow-lg w-fit">
              Company Profile Video
            </h3>
          </div>
          
          <!-- Video 2 Card -->
          <div class="flex flex-col items-center">
            <div class="overflow-hidden rounded-2xl shadow-lg w-full h-80 bg-black">
              <video class="w-full h-full object-contain rounded-2xl" loop controls muted playsinline>
                <source src="videos/video2.mp4" type="video/mp4">
              </video>
            </div>
            <h3 class="font-serif text-lg mt-4 text-white text-center bg-gradient-to-r from-purple-600 via-pink-500 to-yellow-400 px-4 py-2 rounded-full shadow-lg w-fit">
              Event Highlights
            </h3>
          </div>
          
          <!-- Video 3 Card -->
          <div class="flex flex-col items-center">
            <div class="overflow-hidden rounded-2xl shadow-lg w-full h-80 bg-black">
              <video class="w-full h-full object-contain rounded-2xl" loop controls muted playsinline>
                <source src="videos/video3.mp4" type="video/mp4">
              </video>
            </div>
          </div>
          
          <!-- Video 4 Card -->
          <div class="flex flex-col items-center">
            <div class="overflow-hidden rounded-2xl shadow-lg w-full h-80 bg-black">
              <video class="w-full h-full object-contain rounded-2xl" loop controls muted playsinline>
                <source src="videos/video4.mp4" type="video/mp4">
              </video>
            </div>
          </div>
          
          <!-- Video 5 Card -->
          <div class="flex flex-col items-center">
            <div class="overflow-hidden rounded-2xl shadow-lg w-full h-80 bg-black">
              <video class="w-full h-full object-contain rounded-2xl" loop controls muted playsinline>
                <source src="videos/video5.mp4" type="video/mp4">
              </video>
            </div>
          </div>
          
          <!-- Video 6 Card -->
          <div class="flex flex-col items-center">
            <div class="overflow-hidden rounded-2xl shadow-lg w-full h-80 bg-black">
              <video class="w-full h-full object-contain rounded-2xl" loop controls muted playsinline>
                <source src="videos/video6.mp4" type="video/mp4">
              </video>
            </div>
          </div>
          
          <!-- Video 7 Card -->
          <div class="flex flex-col items-center">
            <div class="overflow-hidden rounded-2xl shadow-lg w-full h-80 bg-black">
              <video class="w-full h-full object-contain rounded-2xl" loop controls muted playsinline>
                <source src="videos/video7.mp4" type="video/mp4">
              </video>
            </div>
          </div>
          
          <!-- Video 8 Card -->
          <div class="flex flex-col items-center">
            <div class="overflow-hidden rounded-2xl shadow-lg w-full h-80 bg-black">
              <video class="w-full h-full object-contain rounded-2xl" loop controls muted playsinline>
                <source src="videos/video8.mp4" type="video/mp4">
              </video>
            </div>
          </div>
          
          <!-- Video 9 Card -->
          <div class="flex flex-col items-center">
            <div class="overflow-hidden rounded-2xl shadow-lg w-full h-80 bg-black">
              <video class="w-full h-full object-contain rounded-2xl" loop controls muted playsinline>
                <source src="videos/video9.mp4" type="video/mp4">
              </video>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>
  <script src="js/site.js"></script>
</body>
</html>
